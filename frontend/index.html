<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Favicons from the Waypoint brand sheet (W mark). The `?v=` query is a
      cache buster — bump whenever icons change so browsers refetch.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-dark.png?v=3" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16-dark.png?v=3" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="theme-color" content="#E01F2D" />
    <meta name="description" content="Waypoint — Plan • Track • Ship. Product backlog and roadmap." />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Waypoint" />
    <meta property="og:title" content="Waypoint — Plan • Track • Ship" />
    <meta property="og:description" content="Product backlog and roadmap — plan, track, and ship together." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Waypoint — Plan • Track • Ship" />
    <meta name="twitter:description" content="Product backlog and roadmap — plan, track, and ship together." />
    <meta name="twitter:image" content="/twitter-card.png" />

    <title>Waypoint — Product Backlog & Roadmap</title>
  </head>
  <body class="bg-wp-bg text-wp-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
